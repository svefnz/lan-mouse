name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cargo fmt
        run: cargo fmt --check

  go:
    name: Go frontend ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: frontend-mygo
    env:
      # a step `env:` prefix is bash syntax, which the Windows runner does
      # not have by default
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  ci:
    name: ${{ matrix.job }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # shortcut: windows-latest is dropped because its cargo test step
        # takes ~40 minutes; re-add it once clipboard work lands on a
        # Windows target
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
        job:
          - build
          - check
          - clippy
          - test
    steps:
      - uses: actions/checkout@v6
      # the mygo feature (default) builds frontend-mygo with the Go
      # toolchain in build.rs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - name: Install Linux deps (x11 backends are default features)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libx11-dev libxtst-dev
      # the GTK dev packages are only needed by jobs that build the gtk
      # feature (--all-features); the default build no longer needs GTK
      - name: Install Linux deps (GTK, for all-features jobs only)
        if: runner.os == 'Linux' && matrix.job != 'build'
        run: sudo apt-get install libadwaita-1-dev libgtk-4-dev
      # the macOS build job uses the default features, which no longer
      # include the gtk frontend, so it runs without brew install
      # gtk4 libadwaita; the all-features jobs still build the gtk
      # feature and need it
      - name: Install macOS dependencies (GTK, for all-features jobs only)
        if: runner.os == 'macOS' && matrix.job != 'build'
        run: brew install gtk4 libadwaita
      - name: Record macOS native lib versions for cache key
        if: runner.os == 'macOS' && matrix.job != 'build'
        run: |
          echo "MACOS_LIB_VER=$(brew list --versions glib gtk4 libadwaita | tr '\n' '_')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ env.MACOS_LIB_VER }}
      - name: Install Windows Dependencies - create gtk dir
        if: runner.os == 'Windows'
        run: mkdir C:\gtk-build\gtk\x64\release
      - name: Install Windows Dependencies - install gtk from cache
        uses: actions/cache@v3
        if: runner.os == 'Windows'
        id: cache
        with:
          path: c:/gtk-build/gtk/x64/release/**
          key: gtk-windows-build
          restore-keys: gtk-windows-build
      - name: Install Windows Dependencies - update PATH
        if: runner.os == 'Windows'
        run: |
          echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\pkg-config-lite-0.28-1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo $env:GITHUB_PATH
          echo $env:PATH
      - name: Install Windows dependencies - build gtk
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        run: |
          # choco install msys2
          # choco install visualstudio2022-workload-vctools
          # choco install pkgconfiglite
          py -m venv .venv
          .venv\Scripts\activate.ps1
          py -m pip install gvsbuild
          gvsbuild build --vs-ver=vs2026 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
      - name: cargo build
        if: matrix.job == 'build'
        run: cargo build

      - name: cargo check
        if: matrix.job == 'check'
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test
        if: matrix.job == 'test'
        run: cargo test --workspace --all-features

      - name: cargo clippy
        if: matrix.job == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: clechasseur/rs-clippy-check@v4
        if: matrix.job == 'clippy'
        with:
          args: --workspace --all-targets --all-features
